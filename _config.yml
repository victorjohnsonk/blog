
# Site
site: "Victor Johnson's Blog"
sitename-primary: "Victor Johnson's"
sitename-secondary: "Blog"
name: "Victor Johnson's Blog"
title: "Victor Johnson's Blog | AI Engineering, AI Security & Cybersecurity"
keywords: "AI Engineering, AI Security, Cybersecurity, Generative AI, LLM Security, Agentic AI, RAG Security, Secure AI Systems, AI Agents, Prompt Injection, Machine Learning Security, Azure AI, Victor Johnson"
description: "Technical articles by Victor Johnson, an AI Engineer in cybersecurity, exploring AI security, secure LLMs, agentic AI and real-world engineering."

# Site URL and localisation
url: "https://victorjohnson.online"
baseurl: "/blog"
lang: "en-GB"
timezone: "Europe/London"

# Branding
favicon: "assets/images/core/favicon.ico"

# Repository
repo: "https://github.com/victorjohnsonk/blog"

# Optional integrations - add personal values when configured
google_verify: ""
google_analytics: ""
google_adsense: ""
disqus: ""
email: "hello@victorjohnson.online"
feedburner-list: ""
follow-it-verification-code: ""

# Pages and permalinks
include: ["_pages"]
permalink: "/:title/"

# Collections
collections:
  posts:
    output: true

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-last-modified-at

# Authors
authors:
  admin:
    name: "Victor Johnson"
    slugname: "victor-johnson"
    site: "/blog/about"
    avatar: "https://www.victorjohnson.online/vj-photo.png"
    bio: "AI Engineer working in cybersecurity, writing about AI engineering, AI security, secure LLMs, agentic AI, and practical approaches to building secure AI systems."
    email: "hello@victorjohnson.online"
    github: "victorjohnsonk"
    twitter: ""
    facebook: ""
    instagram: ""
    youtube: ""
    linkedin: "https://www.linkedin.com/in/victor-johnson-7a4700386/"

# Defaults
defaults:
  # All posts
  - scope:
      path: "_posts"
    values:
      layout: "post"
      author: "admin"
      avatar: "/assets/images/avatar1.jpg"

  # All pages
  - scope:
      path: "_pages"
    values:
      layout: "page"

# Markdown and syntax highlighting
markdown: "kramdown"
highlighter: "rouge"

# Pagination
paginate: 15
paginate_path: "/page/:num"

# Exclusions
exclude:
  - "README.markdown"
  - "package.json"
  - "grunt.js"
  - "Gruntfile.js"
  - "Gruntfile.coffee"
  - "node_modules"
