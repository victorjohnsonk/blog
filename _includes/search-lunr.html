
<!-- Pagefind navbar search -->
<form
    id="pagefind-navbar-form"
    class="bd-search hidden-sm-down"
    role="search"
    autocomplete="off"
>
    <input
        type="search"
        class="form-control text-small"
        id="pagefind-navbar-input"
        name="q"
        placeholder="Type keyword and enter..."
        aria-label="Search blog articles"
        aria-controls="pagefind-search-results"
    >
</form>

<style>
    #pagefind-search-overlay {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 2000;
        background: rgba(0, 0, 0, 0.55);
        overflow-y: auto;
        padding: 75px 15px 30px;
    }

    #pagefind-search-overlay.is-open {
        display: block;
    }

    #pagefind-search-overlay .modal-dialog {
        max-width: 750px;
        margin: 0 auto;
    }

    #pagefind-search-overlay .modal-content {
        border: 0;
        border-radius: 8px;
    }

    #pagefind-search-results {
        max-height: 65vh;
        overflow-y: auto;
    }

    .pagefind-result-item {
        padding: 15px 0;
        border-bottom: 1px solid #eee;
    }

    .pagefind-result-item:last-child {
        border-bottom: 0;
    }

    .pagefind-result-title {
        display: block;
        font-weight: 600;
        color: #d9230f;
        font-size: 17px;
        margin-bottom: 5px;
    }

    .pagefind-result-excerpt {
        color: #666;
        font-size: 14px;
        line-height: 1.6;
    }

    .pagefind-result-item a:hover {
        text-decoration: none;
    }

    .pagefind-result-item a:hover .pagefind-result-title {
        text-decoration: underline;
    }

    .pagefind-search-status {
        color: #777;
        padding: 20px 0;
    }

    #pagefind-search-results mark {
        background: #fff1b8;
        padding: 0 2px;
    }
</style>

<script>
(function () {
    "use strict";

    const pagefindBase = {{ '/pagefind/' | relative_url | jsonify }};
    let pagefindInstance = null;
    let activeSearch = 0;

    async function loadPagefind() {
        if (!pagefindInstance) {
            pagefindInstance = import(pagefindBase + "pagefind.js");
        }
        return pagefindInstance;
    }

    function getElements() {
        return {
            form: document.getElementById("pagefind-navbar-form"),
            input: document.getElementById("pagefind-navbar-input"),
            overlay: document.getElementById("pagefind-search-overlay"),
            title: document.getElementById("pagefind-search-title"),
            results: document.getElementById("pagefind-search-results"),
            close: document.getElementById("pagefind-search-close")
        };
    }

    function closePagefindSearch() {
        const el = getElements();

        if (el.overlay) {
            el.overlay.classList.remove("is-open");
            el.overlay.setAttribute("aria-hidden", "true");
        }

        document.body.classList.remove("modal-open");
        activeSearch++;
    }

    function openPagefindSearch() {
        const el = getElements();

        el.overlay.classList.add("is-open");
        el.overlay.setAttribute("aria-hidden", "false");
        document.body.classList.add("modal-open");
        el.close.focus();
    }

    function createResultItem(data) {
        const item = document.createElement("div");
        item.className = "pagefind-result-item";

        const link = document.createElement("a");
        link.href = data.url;

        const title = document.createElement("span");
        title.className = "pagefind-result-title";
        title.textContent =
            (data.meta && data.meta.title) ||
            data.url;

        const excerpt = document.createElement("div");
        excerpt.className = "pagefind-result-excerpt";

        // Pagefind generates highlighted excerpt HTML.
        excerpt.innerHTML = data.excerpt || "";

        link.appendChild(title);
        link.appendChild(excerpt);
        item.appendChild(link);

        return item;
    }

    async function searchWithPagefind(term) {
        const el = getElements();
        const searchId = ++activeSearch;

        openPagefindSearch();

        el.title.textContent = 'Search results for "' + term + '"';
        el.results.innerHTML =
            '<p class="pagefind-search-status">Searching articles...</p>';

        try {
            const pagefind = await loadPagefind();
            const response = await pagefind.search(term);

            if (searchId !== activeSearch) return;

            el.results.replaceChildren();

            if (!response.results.length) {
                el.results.innerHTML =
                    '<p class="pagefind-search-status">No articles found. Try another keyword.</p>';
                return;
            }

            const results = await Promise.all(
                response.results.slice(0, 20).map(result => result.data())
            );

            if (searchId !== activeSearch) return;

            const count = document.createElement("p");
            count.className = "text-muted small";
            count.textContent =
                response.results.length + " matching articles";

            el.results.appendChild(count);

            results.forEach(data => {
                el.results.appendChild(createResultItem(data));
            });

        } catch (error) {
            if (searchId !== activeSearch) return;

            console.error("Pagefind search error:", error);

            el.results.innerHTML =
                '<p class="pagefind-search-status">Search is temporarily unavailable. Please try again later.</p>';
        }
    }

    document.addEventListener("DOMContentLoaded", function () {
        const el = getElements();

        if (!el.form || !el.input || !el.overlay) return;

        el.form.addEventListener("submit", function (event) {
            event.preventDefault();

            const term = el.input.value.trim();

            if (term) {
                searchWithPagefind(term);
            }
        });

        el.close.addEventListener("click", closePagefindSearch);

        el.overlay.addEventListener("click", function (event) {
            if (event.target === el.overlay) {
                closePagefindSearch();
            }
        });

        document.addEventListener("keydown", function (event) {
            if (event.key === "Escape") {
                closePagefindSearch();
            }
        });
    });
})();
</script>
