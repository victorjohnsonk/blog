<span class="reading-time">
  {% assign words = content | number_of_words %}
  {% assign reading_minutes = words | plus: 199 | divided_by: 200 %}
  {% if reading_minutes < 1 %}
    {% assign reading_minutes = 1 %}
  {% endif %}
  {{ reading_minutes }} min{% if reading_minutes != 1 %}s{% endif %} read
</span>
