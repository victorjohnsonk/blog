
name: Build and Deploy Jekyll Blog

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
    
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "2.7"
          bundler-cache: false
      
      - name: Install Ruby dependencies
        run: |
          gem install bundler -v 2.4.22
          bundle _2.4.22_ config set --local frozen false
          bundle _2.4.22_ install

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build Jekyll
        run: bundle exec jekyll build

      - name: Generate Pagefind search index
        run: npx -y pagefind@1.5.2 --site _site

      - name: Verify Pagefind output
        run: |
          test -f _site/index.html
          test -f _site/pagefind/pagefind.js
          test -f _site/pagefind/pagefind-ui.js

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
